name: deploy

# Production deploy runs ONLY when a GitHub Release is published (or manual catch-up
# below). There is no cron, systemd timer, or scheduled deploy task on the server.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (leave empty to deploy the latest published release)
        required: false
        type: string

permissions:
  contents: read

jobs:
  production:
    runs-on: [self-hosted, set-seeker]
    steps:
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            tag="$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)"
            echo "Resolved latest published release: $tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 1

      - name: Blue-green deploy
        run: bash scripts/deploy_release.sh "${{ steps.tag.outputs.tag }}"
