# Release-gate: merges the standing Release PR on schedule (creates a GitHub Release
# when merged). Does NOT deploy — deploy.yml runs only on release: published.
name: release-gate-weekly

on:
  schedule:
    - cron: "0 14 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-patch-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Merge release PR (patch only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/merge-release-pr.mjs weekly
