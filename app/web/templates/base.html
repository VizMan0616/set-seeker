<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}set-seeker{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&family=Alegreya+SC:wght@700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <!-- Root-relative paths: absolute url_for URLs would inherit the scheme uvicorn
       sees (plain http behind a TLS-terminating proxy) and get mixed-content blocked. -->
  <link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx.min.js"></script>
  <script defer src="/static/vendor/alpine.min.js"></script>
</head>
<body>
  <nav class="navbar ss-navbar">
    <div class="container">
      <a class="navbar-brand ss-brand" href="/">
        <span class="ss-crest" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        set-seeker
      </a>
      <span class="ss-navbar-note d-none d-sm-inline">armor set search for classic Monster Hunter</span>
    </div>
  </nav>
  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>
  <footer class="container pb-4">
    <p class="ss-footer">Open source (AGPLv3) · game data derived from Athena's ASS (MIT) · see NOTICE · v{{ app_version }}</p>
  </footer>
  <script src="/static/vendor/bootstrap.bundle.min.js"></script>
</body>
</html>
