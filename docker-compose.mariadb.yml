# Optional MariaDB backend (ADR 0014). Usage:
#   docker compose -f docker-compose.yml -f docker-compose.mariadb.yml up --build
#
# Install pymysql in the image first (one-time) or extend Dockerfile with:
#   pip install pymysql

services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: setseeker
      MARIADB_DATABASE: setseeker
      MARIADB_USER: setseeker
      MARIADB_PASSWORD: setseeker
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  set-seeker:
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://setseeker:setseeker@mariadb:3306/setseeker

volumes:
  mariadb-data:
