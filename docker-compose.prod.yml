# Production overlay: Traefik edge proxy + blue/green app slots (ADR 0015).
#
# Usage (from a release checkout):
#   export RELEASE_ROOT=/opt/set-seeker/releases/v0.1.0
#   export SETSEEKER_VERSION=v0.1.0
#   export TRAEFIK_ENABLE_BLUE=true
#   export TRAEFIK_ENABLE_GREEN=false
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Prefer scripts/deploy_release.sh on the self-hosted runner.

networks:
  setseeker-public:
    name: setseeker-public

services:
  traefik:
    image: traefik:v3.2
    container_name: set-seeker-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"   # enable with TLS entrypoint when domain exists
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${RELEASE_ROOT:-.}/docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - setseeker-public

  set-seeker-blue:
    build:
      context: ${RELEASE_ROOT:-.}
      dockerfile: Dockerfile
    container_name: set-seeker-blue
    restart: unless-stopped
    volumes:
      - setseeker-data:/data
      - ${RELEASE_ROOT:-.}/app:/srv/setseeker/app:ro
      - ${RELEASE_ROOT:-.}/packs:/srv/setseeker/packs:ro
      - ${RELEASE_ROOT:-.}/alembic:/srv/setseeker/alembic:ro
      - ${RELEASE_ROOT:-.}/alembic.ini:/srv/setseeker/alembic.ini:ro
      - ${RELEASE_ROOT:-.}/config:/srv/setseeker/config:ro
    env_file:
      - path: ${RELEASE_ROOT:-.}/config/.env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/setseeker.db
      SETSEEKER_VERSION: ${SETSEEKER_VERSION:-dev}
    networks:
      - setseeker-public
    labels:
      - traefik.enable=${TRAEFIK_ENABLE_BLUE:-true}
      - traefik.http.routers.setseeker-blue.rule=PathPrefix(`/`)
      - traefik.http.routers.setseeker-blue.entrypoints=web
      - traefik.http.routers.setseeker-blue.service=setseeker-blue
      - traefik.http.services.setseeker-blue.loadbalancer.server.port=8000

  set-seeker-green:
    build:
      context: ${RELEASE_ROOT:-.}
      dockerfile: Dockerfile
    container_name: set-seeker-green
    restart: unless-stopped
    volumes:
      - setseeker-data:/data
      - ${RELEASE_ROOT:-.}/app:/srv/setseeker/app:ro
      - ${RELEASE_ROOT:-.}/packs:/srv/setseeker/packs:ro
      - ${RELEASE_ROOT:-.}/alembic:/srv/setseeker/alembic:ro
      - ${RELEASE_ROOT:-.}/alembic.ini:/srv/setseeker/alembic.ini:ro
      - ${RELEASE_ROOT:-.}/config:/srv/setseeker/config:ro
    env_file:
      - path: ${RELEASE_ROOT:-.}/config/.env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/setseeker.db
      SETSEEKER_VERSION: ${SETSEEKER_VERSION:-dev}
    networks:
      - setseeker-public
    labels:
      - traefik.enable=${TRAEFIK_ENABLE_GREEN:-false}
      - traefik.http.routers.setseeker-green.rule=PathPrefix(`/`)
      - traefik.http.routers.setseeker-green.entrypoints=web
      - traefik.http.routers.setseeker-green.service=setseeker-green
      - traefik.http.services.setseeker-green.loadbalancer.server.port=8000

  # Default single-service profile is not used in production.
  set-seeker:
    profiles: [dev-only]
