# sources/MHFU-ASS/Run/Data/Languages/{TeamHGG MHP2ndG,English MHFU}/.
# Keys: names as they appear in `mhfu set mix.txt`.
# Values: Athena CSV `name_en` (what ETL stores).
#
# confidence:
#   high   — typo, spacing, punctuation, obvious G-rank "Shin" = True
#   medium — forum synonym for an awakened skill (not in overlays)

