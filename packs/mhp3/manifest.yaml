id: mhp3
name: "Monster Hunter Portable 3rd"
generation: 3
data_version: 1
data:
  armor_dir: vendor/data
  locale_overlays:
    en: vendor/locales/en
provenance:
  upstream: AthenaADP/MHP3-ASS
  commit: a22f3ac23e401bd1e1b1df505ebbc5c7590a75b2
  license: MIT
translation: fan                 # ADR 0009: never officially localized
features:
  talismans: true
  charm_tables: true             # 12 seeded RNG tables (not MH3U's 17)
  charm_generation: false        # CSVs are extracted facts; not gen4+ live gen
  excavated_gear: false
  weapon_search: false
  charm_up: false
  skill_plus_two: false
  compound_skills: false
desired_skills_max: 6            # Athena Form1.h NumSkills (Form1.h:95); not 9
charm_points:                    # documented union; ETL overwrites from CSVs
  skill1_min: 1                  # skill 1 never negative; stepper skips 0
  skill1_max: 10                 # union of *_skill1.csv maxima (mystery +10)
  skill2_min: -10                # union of *_skill2.csv floors
  skill2_max: 13                 # union of *_skill2.csv ceilings (res / gathering)
progression:
  guild_rank: 6                  # Athena nudHR max (Form1.h:655)
  village_stars: 6               # Athena nudElder max (Form1.h:708)
formats:
  armor_file_ext: txt
  armor_header_lines: 0          # `#` comment headers skipped by the loader
  skills_leading_index_columns: 0
locales: [en, ja]
